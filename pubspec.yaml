name: chimee
description: "A Traditional Mongolian vertical text editor, card creator, and code conversion tool."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  material_ui: ^1.5.0
  mongol: ^11.2.0
  mongol_code: ^1.0.5
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4
  test: ^1.25.15

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Qagan
      fonts:
        - asset: assets/fonts/MQG8F02.ttf
    - family: ChimeeWhite
      fonts:
        - asset: assets/fonts/ChimeeWhiteMirrored.ttf
    - family: Garqag
      fonts:
        - asset: assets/fonts/MGQ8102.ttf
    - family: Hara
      fonts:
        - asset: assets/fonts/MHR8102.ttf
    - family: Scnin
      fonts:
